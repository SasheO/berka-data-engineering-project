models:
  - name: dim_account
    description: Dimesion table for customer accounts. Grain - One row per account
    columns:
      - name: account_id
        description: Unique primary key for the account
        data_tests:
          - unique
          - not_null
      - name: district_id
        description: location of the branch
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_demographic_district')
                field: district_id
      - name: statement_issue_frequency
        description: frequency of issuance of statements
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: 
                  - 'monthly issuance'
                  - 'weekly issuance'
                  - 'issuance after transaction'
                  - 'unknown'
      - name: date_created
        description: date the account was created
        data_tests:
          - not_null

  - name: dim_client
    description: Dimesion table for bank customers/clients. Grain - One row per client
    columns:
      - name: client_id
        description: Unique primary key for the client
        data_tests:
          - unique
          - not_null
      - name: district_id
        description: Foreign key linking to the district location of the branch
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_demographic_district')
                field: district_id
      - name: district_name
        description: Name of the district where branch is located
        data_tests:
          - not_null
      - name: sex
        description: client's gender
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: 
                  - 'M'
                  - 'F'
      - name: date_of_birth
        description: client's date of birth
        data_tests:
          - not_null

  - name: dim_credit_card
    description: Dimension table for credit card information. Grain - One row per card
    columns:
      - name: credit_card_id
        description: Unique primary key for the credit card
        data_tests:
          - unique
          - not_null
      - name: disposition_id
        description: Foreign key linking to the disposition of the card (the client-account the card pertains to)
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_disposition')
                field: disposition_id
      - name: credit_card_type
        description: Type of credit card (e.g., classic, gold, junior)
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: 
                  - 'classic'
                  - 'gold'
                  - 'junior'
      - name: date_of_issue
        description: Date when the credit card was issued (converted from 2-digit year format)
        data_tests:
          - not_null
      - name: date_of_expiry
        description: Date when the credit card will expire. Defaults to '9999-12-31' if none in source data
        data_tests:
          - not_null

  - name: dim_demographic_district
    description: Dimension table for demographic information by district. Grain - One row per district
    columns:
      - name: district_id
        description: Unique primary key for the district
        data_tests:
          - unique
          - not_null
      - name: district_name
        description: Name of the district
        data_tests:
          - not_null
      - name: region
        description: Geographic region where the district is located
        data_tests:
          - not_null
      - name: number_of_inhabitants
        description: Total population of the district
        data_tests:
          - not_null
      - name: number_of_municipalities_fewer_than_499_inhabitants
        description: Count of municipalities with fewer than 499 inhabitants. Records which are invalid from source table default to -1 value
        data_tests:
          - not_null
      - name: number_of_municipalities_between_500_and_1999_inhabitants
        description: Count of municipalities with between 500 and 1999 inhabitants. Records which are invalid from source table default to -1 value
        data_tests:
          - not_null
      - name: number_of_municipalities_between_2000_and_9999_inhabitants
        description: Count of municipalities with between 2000 and 9999 inhabitants. Records which are invalid from source table default to -1 value
        data_tests:
          - not_null
      - name: number_of_municipalities_greater_than_10000_inhabitants
        description: Count of municipalities with more than 10,000 inhabitants. Records which are invalid from source table default to -1 value
        data_tests:
          - not_null
      - name: total_number_of_municipalities
        description: the total number of municipalities
      - name: number_of_cities
        description: Total number of cities in the district
        data_tests:
          - not_null
      - name: urban_ratio
        description: Ratio of urban population to total population
        data_tests:
          - not_null
      - name: average_salary
        description: Average salary in the district
        data_tests:
          - not_null
      - name: ratio_of_enterpreneurs
        description: Ratio of entrepreneurs to total population
        data_tests:
          - not_null
  
  - name: dim_disposition
    description: Dimension table for client-account dispositions (ownership relationships). Grain - One row per disposition of an account
    columns:
      - name: disposition_id
        description: Unique primary key for the disposition record
        data_tests:
          - unique
          - not_null
      - name: client_id
        description: Foreign key linking to the client
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_client')
                field: client_id
      - name: account_id
        description: Foreign key linking to the account
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_account')
                field: account_id
      - name: type
        description: Type of disposition (e.g., owner, user, etc.)
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: 
                  - 'OWNER'
                  - 'DISPONENT'
  
  - name: fact_daily_account_closing_balance
    description: Fact table containing daily closing balances and transaction statistics per account. Grain - One row per account per day
    columns:
      - name: account_id
        description: Foreign key linking to the account
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_account')
                field: account_id
      - name: accounting_date
        description: Date of the account closing balance
        data_tests:
          - not_null
      - name: district_id
        description: Foreign key linking to the district where the account belongs
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_demographic_district')
                field: district_id
      - name: closing_balance
        description: Daily closing balance of the account
        data_tests:
          - not_null
      - name: number_of_transactions
        description: Total number of transactions for the account on that day
        data_tests:
          - not_null
      - name: absolute_transaction_value
        description: Sum of absolute transaction values for the day
        data_tests:
          - not_null
      - name: net_transaction_value
        description: Net transaction value (credits minus withdrawals) for the day
        data_tests:
          - not_null

  - name: fact_district_statistic
    description: Fact table containing annual district statistics for unemployment and crime rates. Grain - One row per year per district
    columns:
      - name: district_id
        description: Foreign key linking to the district
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_demographic_district')
                field: district_id
      - name: year
        description: Year of the district statistics
        data_tests:
          - not_null
      - name: unemployment_rate
        description: Annual unemployment rate for the district
        data_tests:
          - not_null
      - name: number_of_committed_crimes
        description: Annual number of committed crimes in the district
        data_tests:
          - not_null

  - name: fact_transaction
    description: Staged model for transactions processing within this financial institution. Grain - One row per transaction per account
    columns:
      - name: transaction_id
        description: Unique primary key for the transaction
        data_tests:
          - unique
          - not_null
      - name: account_id
        description: Foreign key linking to the account tied to this transaction
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_account')
                field: account_id
      - name: transaction_date
        description: Date when the transaction occurred (converted from 2-digit year format)
        data_tests:
          - not_null
      - name: transaction_type
        description: Type of transaction (credit or withdrawal)
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: 
                  - 'credit'
                  - 'withdrawal'
                  - 'unknown'
      - name: transaction_operation
        description: Specific operation performed in the transaction
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: 
                  - 'credit card withdrawal'
                  - 'credit in cash'
                  - 'collection from another bank'
                  - 'withdrawal in cash'
                  - 'remittance to another bank'
                  - 'unknown'
      - name: transaction_amount
        description: Amount of the transaction
        data_tests:
          - not_null
      - name: account_balance_after_transaction
        description: Account balance after the transaction was carried out
        data_tests:
          - not_null
      - name: account_balance_before_transaction
        description: Account balance before the transaction was carried out
        data_tests:
          - not_null
      - name: transaction_characterisation
        description: Characterisation of the transaction purpose
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: 
                  - 'insurance payment'
                  - 'payment for statement'
                  - 'interest credited'
                  - 'sanction interest if negative balance'
                  - 'household'
                  - 'old ­age pension'
                  - 'loan payment'
                  - 'unknown'
      - name: bank_code
        description: Code of the partner bank (if applicable)
      - name: partner_account_id
        description: Partner account ID (if applicable)
      - name: district_id
        description:  Foreign key linking to the district tied to the account of this transaction 
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_demographic_district')
                field: district_id
      - name: primary_client_id
        description: Foreign key linking to the primary client of this account
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_client')
                field: client_id
      - name: transaction_id_immediately_after_on_same_day
        description: The next transaction carried out on the same account on the same day, or 0 if that was the last transaction for the day on that account
        data_tests:
          - not_null